# Cały stack ze źródeł: docker compose up -d --build, potem http://localhost:8080
# Kolektory (profil jobs) są jednorazowe: docker compose run --rm --build collector youtube_posts forex
# Weryfikacja środowiska: bash deploy/verify.sh <dev|prod>

x-service: &service
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  collector:
    profiles: [jobs]
    image: investwatch/uknf-collector:local
    build:
      context: .
      dockerfile: scrapers/Dockerfile
    init: true
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: .env
        required: false
    volumes:
      - collector-results:/app/scrapers/poc/results
      - collector-cache:/cache/huggingface
      - ${SECRETS_PATH:-./.secrets}:/app/.secrets:ro

  frontend:
    <<: *service
    image: investwatch/uknf-frontend:local
    build:
      context: ./frontend
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:4000
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"

  # Mock API jest kontraktem backendu. Gdy powstanie backend, podmieniamy tylko ten serwis.
  api:
    <<: *service
    image: investwatch/uknf-mock-api:local
    build:
      context: ./frontend
      dockerfile: mock-server/Dockerfile
    depends_on:
      - ai-service
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DATA_MODE: ${DATA_MODE:-mock}
      AI_URL: http://ai-service:8000
      STATE_PATH: /state/state.json
      SCRAPE_WORKER_URL: http://scrape-worker:8100
      MOCK_SEED: ${MOCK_SEED:-42}
      MOCK_CORS_ORIGIN: ${MOCK_CORS_ORIGIN:-*}
    volumes:
      - ./frontend/mock-server/data:/app/mock-server/data:ro
      - api-state:/state

  ai-service:
    <<: *service
    image: investwatch/uknf-ai-service:local
    build:
      context: ./ml
      target: runtime-cpu
    environment:
      INVESTWATCH_BASELINE: ${INVESTWATCH_BASELINE:-0}
      # Silnik LLM: none | groq (GROQ_API_KEY) | ollama (lokalny Bielik: dodaj --profile local-llm)
      LLM_BACKEND: ${LLM_BACKEND:-none}
      LLM_MODEL: ${LLM_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Ollama zainstalowana na komputerze zamiast w kontenerze
    # Tylko localhost: serwis nie ma autoryzacji i nie może być publiczny.
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    volumes:
      - ${MODELS_PATH:-./ml/models}:/app/models:ro
      - hf-cache:/cache/huggingface

  # Przycisk „Zbieranie danych” i harmonogram. Bez opublikowanych portów: steruje nim tylko usługa api.
  scrape-worker:
    <<: *service
    image: investwatch/uknf-collector:local
    build:
      context: .
      dockerfile: scrapers/Dockerfile
    init: true
    shm_size: 1gb
    entrypoint: ["python", "/app/scrapers/worker.py"]
    depends_on:
      - ai-service
    env_file:
      - path: .env
        required: false
    environment:
      AI_URL: http://ai-service:8000
      API_URL: http://api:4000
      JOBS_DIR: /jobs
    volumes:
      - job-state:/jobs
      - collector-results:/app/scrapers/poc/results
      - collector-cache:/cache/huggingface
      - ${SECRETS_PATH:-./.secrets}:/app/.secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8100/health', timeout=4)"]
      interval: 20s
      timeout: 5s
      retries: 5

  # Lokalny LLM: LLM_BACKEND=ollama docker compose --profile local-llm up -d --build
  ollama:
    profiles: [local-llm]
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10

  ollama-pull:
    profiles: [local-llm]
    image: ollama/ollama:0.40.16
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${LLM_MODEL:-SpeakLeash/bielik-11b-v3.1-instruct:Q4_K_M}"]

volumes:
  ollama-models:
  job-state:
  api-state:
  collector-results:
  collector-cache:
  hf-cache:
