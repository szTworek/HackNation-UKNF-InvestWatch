# Cały stack ze źródeł: docker compose up -d --build, potem http://localhost:8080
# Dane: Postgres (rekordy, wyniki, statusy, progi, podmioty) + MinIO (grafiki, zrzuty stron); ładuje je usługa loader przy każdym up.
# Kolektory (profil jobs) są jednorazowe: docker compose run --rm --build collector youtube_posts forex
# Weryfikacja środowiska: bash deploy/verify.sh <dev|prod>

x-service: &service
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

x-db-env: &db-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-investwatch}:${POSTGRES_PASSWORD:-investwatch}@postgres:5432/${POSTGRES_DB:-investwatch}

services:
  postgres:
    <<: *service
    image: pgvector/pgvector:pg16
    # entrypoint obrazu ustawia właściciela katalogu danych i przechodzi na użytkownika postgres
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investwatch}
      POSTGRES_USER: ${POSTGRES_USER:-investwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-investwatch}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  # Object Storage (D4). Konsola tylko na localhost: http://127.0.0.1:9001
  # Obrazy minio/minio zniknęły z Docker Hub i quay.io; bitnamilegacy to ostatnie publiczne, zamrożone wydanie.
  minio:
    <<: *service
    image: &minio-image bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-investwatch}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-investwatch-dev}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Jednorazowo: buckety media i screens (odczyt anonimowy tylko w sieci Compose) + kopia plików z data/.
  minio-init:
    image: *minio-image
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-investwatch}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-investwatch-dev}
      MC_CONFIG_DIR: /tmp/mc
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        # obraz bitnami restartuje serwer po konfiguracji, więc pierwsze połączenie może się nie udać
        for n in $$(seq 30); do mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && break; sleep 2; done
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        for b in media screens; do mc mb -p "local/$$b" >/dev/null; mc anonymous set download "local/$$b" >/dev/null; done
        mc mirror --overwrite --quiet /seed/media local/media
        if [ -d /seed/monitor/screens ]; then mc mirror --overwrite --quiet /seed/monitor/screens local/screens; fi
        mc du local/media local/screens
    volumes:
      - ./data/media:/seed/media:ro
      - ./data/monitor:/seed/monitor:ro

  # Jednorazowo przy każdym up (kilka sekund, aplikacja startuje po nim): migracje, rejestr KNF, podmioty, rekordy, monitor, media.
  db-init:
    image: investwatch/uknf-loader:local
    build:
      context: .
      dockerfile: db/Dockerfile
    command: ["--stage", "init"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *db-env
    volumes:
      - ./data:/app/data:ro

  # W tle przy każdym up: ocena nowych rekordów w ai-service. API pokazuje postęp i nowe wyniki na bieżąco.
  loader:
    image: investwatch/uknf-loader:local
    command: ["--stage", "score"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db-init:
        condition: service_completed_successfully
      ai-service:
        condition: service_started
    environment:
      <<: *db-env
      AI_URL: http://ai-service:8000
      # Z LLM (np. Groq) ocenia najwyżej tyle rekordów na przebieg; kolejne porcje: docker compose run --rm loader
      LOADER_LLM_LIMIT: ${LOADER_LLM_LIMIT:-100}
      LOADER_LLM_BATCH: ${LOADER_LLM_BATCH:-8}
    volumes:
      - ./data:/app/data:ro

  collector:
    profiles: [jobs]
    image: investwatch/uknf-collector:local
    build:
      context: .
      dockerfile: scrapers/Dockerfile
    init: true
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: .env
        required: false
    volumes:
      - collector-results:/app/scrapers/poc/results
      - collector-cache:/cache/huggingface
      - ${SECRETS_PATH:-./.secrets}:/app/.secrets:ro

  frontend:
    <<: *service
    image: investwatch/uknf-frontend:local
    build:
      context: ./frontend
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:4000
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"

  # Backend aplikacji (api/): REST + socket.io, dane z Postgresa i MinIO.
  api:
    <<: *service
    image: investwatch/uknf-api:local
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      ai-service:
        condition: service_started
      minio:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    environment:
      <<: *db-env
      AI_URL: http://ai-service:8000
      MINIO_URL: http://minio:9000
      SCRAPE_WORKER_URL: http://scrape-worker:8100
      CORS_ORIGIN: ${CORS_ORIGIN:-*}

  ai-service:
    <<: *service
    image: investwatch/uknf-ai-service:local
    build:
      context: ./ml
      target: runtime-cpu
    environment:
      INVESTWATCH_BASELINE: ${INVESTWATCH_BASELINE:-0}
      # Silnik LLM: none | groq (GROQ_API_KEY) | ollama (lokalny Bielik: dodaj --profile local-llm)
      LLM_BACKEND: ${LLM_BACKEND:-none}
      LLM_MODEL: ${LLM_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Ollama zainstalowana na komputerze zamiast w kontenerze
    # Tylko localhost: serwis nie ma autoryzacji i nie może być publiczny.
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    volumes:
      - ${MODELS_PATH:-./ml/models}:/app/models:ro
      - hf-cache:/cache/huggingface

  # Przycisk „Zbieranie danych” i harmonogram. Bez opublikowanych portów: steruje nim tylko usługa api.
  scrape-worker:
    <<: *service
    image: investwatch/uknf-collector:local
    build:
      context: .
      dockerfile: scrapers/Dockerfile
    init: true
    shm_size: 1gb
    entrypoint: ["python", "/app/scrapers/worker.py"]
    depends_on:
      ai-service:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      <<: *db-env
      AI_URL: http://ai-service:8000
      API_URL: http://api:4000
      JOBS_DIR: /jobs
    volumes:
      - job-state:/jobs
      - collector-results:/app/scrapers/poc/results
      - collector-cache:/cache/huggingface
      - ${SECRETS_PATH:-./.secrets}:/app/.secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8100/health', timeout=4)"]
      interval: 20s
      timeout: 5s
      retries: 5

  # Lokalny LLM: LLM_BACKEND=ollama docker compose --profile local-llm up -d --build
  ollama:
    profiles: [local-llm]
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10

  ollama-pull:
    profiles: [local-llm]
    image: ollama/ollama:0.40.16
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${LLM_MODEL:-SpeakLeash/bielik-11b-v3.1-instruct:Q4_K_M}"]

volumes:
  pg-data:
  minio-data:
  ollama-models:
  job-state:
  collector-results:
  collector-cache:
  hf-cache:
