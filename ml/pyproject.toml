[project]
name = "investwatch-ml"
version = "0.1.0"
description = "InvestWatch – klasyfikacja treści inwestycyjnych (social media / transkrypcje)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "transformers>=4.48",
    "sentence-transformers>=3.3",
    "datasets>=3.0",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "httpx>=0.27",
    "ollama>=0.4",
    "pydantic>=2.8",
    "rapidfuzz>=3.9",
    "langdetect>=1.0.9",
    "yt-dlp>=2025.1.1",
    "youtube-transcript-api>=1.0",
    "beautifulsoup4>=4.12",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investwatch_ml"]
