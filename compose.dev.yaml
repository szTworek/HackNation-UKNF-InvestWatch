# Lokalny development: budowanie ze źródeł, kod montowany z hosta.
#   Kolektory: docker compose -f compose.yaml -f compose.dev.yaml run --rm --build collector youtube_posts forex
#   Aplikacja: docker compose -f compose.yaml -f compose.dev.yaml up --build
# Front: http://localhost:5173 · API: http://localhost:4000/api · AI: http://localhost:8000/docs

services:
  collector:
    image: investwatch-collector:dev
    build:
      context: .
      dockerfile: scrapers/Dockerfile
    volumes: !override
      - ./scrapers:/app/scrapers
      - ./adapters:/app/adapters
      - ./preprocessing:/app/preprocessing
      - ./.secrets:/app/.secrets:ro
      - collector-cache:/cache/huggingface

  frontend:
    image: investwatch-frontend:dev
    build:
      context: ./frontend
      target: dev
    restart: "no"
    environment:
      VITE_API_URL: http://localhost:4000/api
      VITE_WS_URL: http://localhost:4000
    ports: !override
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  api:
    image: investwatch-api:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    restart: "no"
    read_only: false
    command: ["npx", "tsx", "watch", "mock-server/server.ts"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  ai-service:
    image: investwatch-ai-service:dev
    build:
      context: ./ml
      target: dev
    restart: "no"
    environment:
      # Domyślnie baseline: start bez pobierania embeddera. INVESTWATCH_BASELINE=0 włącza model.
      INVESTWATCH_BASELINE: ${INVESTWATCH_BASELINE:-1}
    volumes:
      - ./ml/src:/app/src
      - ./ml/models:/app/models:ro
