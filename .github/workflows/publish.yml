name: Publish images

# Gotowe obrazy w ghcr.io, żeby `docker compose` mógł je pobrać zamiast budować ze źródeł.
on:
  push:
    branches: [main, szymon]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: collector
            context: .
            file: scrapers/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
          - name: mock-api
            context: frontend
            file: frontend/mock-server/Dockerfile
          - name: ai-service
            context: ml
            file: ml/Dockerfile
            target: runtime-cpu
    steps:
      - name: Free runner disk space
        if: matrix.name == 'collector' || matrix.name == 'ai-service'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          docker image prune -af > /dev/null
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/sztworek/investwatch-${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/sztworek/investwatch-${{ matrix.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=image-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.name }}
