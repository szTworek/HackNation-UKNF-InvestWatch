name: Deploy

# Wdrożenie weryfikacyjne na runnerze: projekt nie ma serwera ani publikowanych obrazów.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          docker image prune -af > /dev/null
          df -h /
      - uses: actions/checkout@v5
      - name: Build, start and verify the stack
        run: bash deploy/verify.sh "${{ inputs.environment }}"
