name: CD

# Testy -> bezpieczeństwo -> obrazy i ich skan -> wdrożenie weryfikacyjne dev -> prod.
# Obrazy nie są nigdzie publikowane; recenzent uruchamia projekt przez docker compose up.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      actions: read
      security-events: write
    secrets: inherit

  images:
    name: Image ${{ matrix.name }}
    needs: [ci, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: collector
            context: .
            file: scrapers/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
          - name: mock-api
            context: frontend
            file: frontend/mock-server/Dockerfile
          - name: ai-service
            context: ml
            file: ml/Dockerfile
            target: runtime-cpu
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: scan/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=image-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.name }}
      - id: scan
        name: Scan image (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: scan/${{ matrix.name }}:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif
      # Bez code scanningu SARIF nie trafia do zakładki Security, więc wypisujemy znaleziska w logu.
      - name: Show image findings
        if: always() && steps.scan.outputs.sarif != ''
        env:
          SARIF: ${{ steps.scan.outputs.sarif }}
        run: |
          findings=$(jq -r '.runs[]
            | ([.tool.driver.rules[]?] | map({key: .id, value: ((.properties["security-severity"] // "0") | tonumber)}) | from_entries) as $sev
            | .results[]? | select(($sev[.ruleId] // 0) >= 7)
            | "\($sev[.ruleId]) \(.ruleId) \(.message.text | split("\n")[0])"' "$SARIF" | sort -rn | uniq)
          { echo "### Grype ${{ matrix.name }}: high/critical"; echo '```'; printf '%s\n' "${findings:-brak}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${findings:-brak}"
      - name: Upload image scan to Security tab
        if: always() && steps.scan.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: image-${{ matrix.name }}

  deploy-dev:
    needs: images
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev

  deploy-prod:
    needs: deploy-dev
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
